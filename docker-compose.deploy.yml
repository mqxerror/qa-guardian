# =============================================================================
# QA Guardian - Production Deployment Overlay
# =============================================================================
# Extends docker-compose.yml with Traefik labels and dokploy-network access.
# Used by the CI/CD deploy script to make backend + frontend routable
# through Dokploy's Traefik reverse proxy.
#
# Usage (always pair with base compose):
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml build backend frontend
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d backend frontend
# =============================================================================

services:
  backend:
    # Override networks: keep qa-network (for inter-service comms) + add dokploy-network (for Traefik)
    environment:
      # Production: Backend is API-only — separate worker container handles test execution.
      # Prevents dual-worker race condition and stale-job-cleanup killing worker's active jobs.
      - EXECUTION_MAX_CONCURRENCY=0
    networks:
      qa-network: {}
      dokploy-network: {}
    labels:
      # --- Traefik: Network selection (required when container is on multiple networks) ---
      - "traefik.docker.network=dokploy-network"
      # --- Traefik: API routing ---
      - "traefik.enable=true"
      - "traefik.http.routers.qa-guardian-api.rule=Host(`qa.pixelcraftedmedia.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.qa-guardian-api.entrypoints=websecure"
      - "traefik.http.routers.qa-guardian-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.qa-guardian-api.loadbalancer.server.port=3001"
      - "traefik.http.routers.qa-guardian-api.priority=10"
      # --- Traefik: WebSocket routing (Socket.IO) ---
      - "traefik.http.routers.qa-guardian-ws.rule=Host(`qa.pixelcraftedmedia.com`) && PathPrefix(`/socket.io`)"
      - "traefik.http.routers.qa-guardian-ws.entrypoints=websecure"
      - "traefik.http.routers.qa-guardian-ws.tls.certresolver=letsencrypt"
      - "traefik.http.services.qa-guardian-ws.loadbalancer.server.port=3001"
      - "traefik.http.routers.qa-guardian-ws.priority=10"

  # Worker does NOT need Traefik labels - it is not HTTP-facing.
  # It only needs the internal qa-network for Redis and PostgreSQL access.
  worker:
    networks:
      qa-network: {}

  # T4.7 (fix): mcp-server hosts SSE at /mcp-server/sse for Claude Code CLI
  # and other MCP clients. Dokploy was auto-discovering this container and
  # routing /mcp-server/* to it with the prefix INTACT — mcp-server's own
  # path matcher (/sse, /message, /health) never matched. Explicit Traefik
  # labels override the auto-discovery: route here, strip the prefix first.
  mcp-server:
    networks:
      qa-network: {}
      dokploy-network: {}
    labels:
      - "traefik.docker.network=dokploy-network"
      - "traefik.enable=true"
      # Strip the /mcp-server prefix before forwarding to the container
      - "traefik.http.middlewares.mcp-server-strip.stripprefix.prefixes=/mcp-server"
      # Host + path rule. Priority 15 so it beats the frontend catch-all (priority 1).
      - "traefik.http.routers.qa-guardian-mcp.rule=Host(`qa.pixelcraftedmedia.com`) && PathPrefix(`/mcp-server`)"
      - "traefik.http.routers.qa-guardian-mcp.entrypoints=websecure"
      - "traefik.http.routers.qa-guardian-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.routers.qa-guardian-mcp.priority=15"
      - "traefik.http.routers.qa-guardian-mcp.middlewares=mcp-server-strip"
      - "traefik.http.services.qa-guardian-mcp.loadbalancer.server.port=3002"

  frontend:
    # Override networks: keep qa-network + add dokploy-network (for Traefik)
    networks:
      qa-network: {}
      dokploy-network: {}
    labels:
      # --- Traefik: Network selection (required when container is on multiple networks) ---
      - "traefik.docker.network=dokploy-network"
      # --- Traefik: Frontend catch-all routing ---
      - "traefik.enable=true"
      - "traefik.http.routers.qa-guardian-frontend.rule=Host(`qa.pixelcraftedmedia.com`)"
      - "traefik.http.routers.qa-guardian-frontend.entrypoints=websecure"
      - "traefik.http.routers.qa-guardian-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.qa-guardian-frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.qa-guardian-frontend.priority=1"
      # --- Traefik: HTTP → HTTPS redirect ---
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.qa-guardian-frontend-http.rule=Host(`qa.pixelcraftedmedia.com`)"
      - "traefik.http.routers.qa-guardian-frontend-http.entrypoints=web"
      - "traefik.http.routers.qa-guardian-frontend-http.middlewares=redirect-to-https"

# External network managed by Dokploy/Traefik
networks:
  dokploy-network:
    external: true
    name: dokploy-network

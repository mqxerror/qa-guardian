# =============================================================================
# QA Guardian - Build, Test & Deploy to Production
# =============================================================================
# Push to main → Build & Test → Deploy to production (qa.pixelcraftedmedia.com)
# Manual trigger also supported via workflow_dispatch.
#
# Required GitHub Secrets:
#   - DOKPLOY_HOST: Server IP address
#   - DOKPLOY_SSH_KEY: Private SSH key (ed25519)
#   - DOKPLOY_USER: SSH username (default: root)
#
# Badge: ![Deploy](https://github.com/mqxerror/qa-guardian/actions/workflows/deploy.yml/badge.svg)
# =============================================================================

name: Build and Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PRODUCTION_DOMAIN: qa.pixelcraftedmedia.com

jobs:
  # ===========================================================================
  # Job 1: Build & Test
  # ===========================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Test backend
        working-directory: backend
        run: npm test

      # Frontend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://${{ env.PRODUCTION_DOMAIN }}
          VITE_API_BASE_URL: https://${{ env.PRODUCTION_DOMAIN }}
          VITE_SOCKET_URL: https://${{ env.PRODUCTION_DOMAIN }}
          VITE_MCP_URL: https://${{ env.PRODUCTION_DOMAIN }}/mcp
        run: npm run build

  # ===========================================================================
  # Job 2: Deploy to Production
  # ===========================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DOKPLOY_HOST }}
          username: ${{ secrets.DOKPLOY_USER || 'root' }}
          key: ${{ secrets.DOKPLOY_SSH_KEY }}
          command_timeout: 15m
          script: |
            cd /opt/qa-guardian

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Rebuild and deploy backend + frontend
            docker compose build backend frontend
            docker compose up -d --force-recreate backend frontend

            # Wait for services to start
            sleep 15

            # Run migrations
            docker exec qa-guardian-backend npm run migrate || true

            # Health check - fail deployment if backend is unhealthy
            curl -sf http://localhost:3001/health || { echo "ERROR: Backend health check failed"; exit 1; }
            echo "Backend healthy"

      - name: Verify production deployment
        run: |
          sleep 30
          # Retry health check up to 3 times with 10s delay (allows time for Traefik)
          for i in 1 2 3; do
            echo "Health check attempt $i..."
            if curl -sf https://${{ env.PRODUCTION_DOMAIN }}/health; then
              echo "Health check passed"
              break
            fi
            if [ $i -eq 3 ]; then
              echo "ERROR: Health check failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done
          # Verify API is responding (health endpoint is at /health, not /api/v1/health)
          curl -sf https://${{ env.PRODUCTION_DOMAIN }}/health | grep -q '"status":"ok"' || { echo "ERROR: Health check response invalid"; exit 1; }
          echo "API health check passed"

      - name: Deployment complete
        run: |
          echo "Production deployment successful!"
          echo "URL: https://${{ env.PRODUCTION_DOMAIN }}"

# =============================================================================
# QA Guardian - Build, Test & Deploy to Production
# =============================================================================
# Push to main → Build & Test → Deploy to production (qa.pixelcraftedmedia.com)
# Manual trigger also supported via workflow_dispatch.
#
# Required GitHub Secrets:
#   - DOKPLOY_HOST: Server IP address
#   - DOKPLOY_SSH_KEY: Private SSH key (ed25519)
#   - DOKPLOY_USER: SSH username (default: root)
#
# Badge: ![Deploy](https://github.com/mqxerror/qa-guardian/actions/workflows/deploy.yml/badge.svg)
# =============================================================================

name: Build and Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PRODUCTION_DOMAIN: qa.pixelcraftedmedia.com

jobs:
  # ===========================================================================
  # Job 1: Build & Test
  # ===========================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Test backend
        working-directory: backend
        run: npm test

      # Frontend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://${{ env.PRODUCTION_DOMAIN }}
          VITE_API_BASE_URL: https://${{ env.PRODUCTION_DOMAIN }}
          VITE_SOCKET_URL: https://${{ env.PRODUCTION_DOMAIN }}
          VITE_MCP_URL: https://${{ env.PRODUCTION_DOMAIN }}/mcp
        run: npm run build

  # ===========================================================================
  # Job 2: Deploy to Production
  # ===========================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DOKPLOY_HOST }}
          username: ${{ secrets.DOKPLOY_USER || 'root' }}
          key: ${{ secrets.DOKPLOY_SSH_KEY }}
          command_timeout: 15m
          script: |
            cd /opt/qa-guardian

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Rebuild and deploy backend, worker, and frontend
            # Uses deploy overlay to add Traefik labels + dokploy-network
            # --no-cache ensures source changes are always picked up (BuildKit layer cache
            # can serve stale builds when only source files change but Dockerfile doesn't)
            # Worker uses same Dockerfile as backend but runs node dist/worker.js
            docker compose -f docker-compose.yml -f docker-compose.deploy.yml build --no-cache backend worker frontend
            docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --force-recreate backend worker frontend

            # Wait for backend to be ready (start_period is 60s in Dockerfile HEALTHCHECK)
            echo "Waiting for backend to start..."
            for i in $(seq 1 12); do
              sleep 10
              state=$(docker inspect --format='{{.State.Status}}' qa-guardian-backend 2>/dev/null || echo "missing")
              echo "  Attempt $i/12: container state=$state"
              if [ "$state" = "running" ]; then
                # Container is running, try health check
                if docker exec qa-guardian-backend curl -sf http://localhost:3001/health > /dev/null 2>&1; then
                  echo "Backend healthy!"
                  break
                fi
              fi
              if [ $i -eq 12 ]; then
                echo "ERROR: Backend failed to become healthy after 120s"
                echo "--- Container logs (last 50 lines) ---"
                docker logs --tail 50 qa-guardian-backend 2>&1 || true
                echo "--- Container inspect ---"
                docker inspect --format='{{.State.Status}} ExitCode={{.State.ExitCode}}' qa-guardian-backend 2>/dev/null || true
                exit 1
              fi
            done

            # Run migrations
            docker exec qa-guardian-backend npm run migrate || true

            # Verify worker container is running
            echo "Checking worker container..."
            sleep 5
            worker_state=$(docker inspect --format='{{.State.Status}}' qa-guardian-worker 2>/dev/null || echo "missing")
            worker_restarts=$(docker inspect --format='{{.RestartCount}}' qa-guardian-worker 2>/dev/null || echo "unknown")
            echo "  Worker state: $worker_state (restarts: $worker_restarts)"
            if [ "$worker_state" != "running" ] || [ "$worker_restarts" -gt 2 ] 2>/dev/null; then
              echo "WARNING: Worker container unhealthy - dumping logs:"
              docker logs --tail 30 qa-guardian-worker 2>&1 || true
            else
              echo "  Worker health check:"
              docker exec qa-guardian-worker curl -sf http://localhost:3002/health 2>&1 || echo "  Worker health endpoint not ready yet"
            fi

            echo "Backend deployment complete"

      - name: Verify production deployment
        run: |
          sleep 30
          DOMAIN="https://${{ env.PRODUCTION_DOMAIN }}"

          # 1. Verify frontend is accessible via Traefik
          echo "Verifying frontend..."
          for i in 1 2 3; do
            echo "  Frontend check attempt $i..."
            if curl -sf "${DOMAIN}/" -o /dev/null; then
              echo "  Frontend accessible"
              break
            fi
            if [ $i -eq 3 ]; then
              echo "ERROR: Frontend not accessible after 3 attempts"
              exit 1
            fi
            sleep 10
          done

          # 2. Verify backend API is routable through Traefik
          # Any non-502 response proves Traefik can reach the backend container
          echo "Verifying backend API routing via Traefik..."
          for i in 1 2 3; do
            echo "  Backend API check attempt $i..."
            status=$(curl -s -o /dev/null -w "%{http_code}" "${DOMAIN}/api/v1/health")
            if [ "$status" != "502" ] && [ "$status" != "503" ] && [ "$status" != "000" ]; then
              echo "  Backend API routable (HTTP ${status})"
              break
            fi
            if [ $i -eq 3 ]; then
              echo "ERROR: Backend not accessible via Traefik after 3 attempts (HTTP ${status})"
              exit 1
            fi
            sleep 10
          done

          echo "Deployment verified (frontend + backend API confirmed via HTTPS)"

      - name: Deployment complete
        run: |
          echo "Production deployment successful!"
          echo "URL: https://${{ env.PRODUCTION_DOMAIN }}"

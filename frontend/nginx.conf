# QA Guardian Frontend - Nginx Configuration
# Optimized for production with security headers and caching

# Run as nginx user (set in Dockerfile)
user nginx;

# Auto-detect CPU cores
worker_processes auto;

# Error log location
error_log /var/log/nginx/error.log warn;

# Process ID file
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/wasm;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide nginx version
    server_tokens off;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Docker embedded DNS resolver - re-resolves backend hostname every 10s
        # Prevents stale DNS cache when backend container restarts and gets a new IP
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Proxy API requests to backend
        location /api {
            limit_req zone=api_limit burst=20 nodelay;

            # Using variable forces nginx to use resolver instead of static upstream cache
            set $backend_api http://backend:3001;
            proxy_pass $backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running requests (AI operations)
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # T4.7: External MCP clients (Claude Code CLI, other MCP hosts) need
        # the full MCP protocol — not just the JSON-RPC adapter the UI uses.
        # The dedicated mcp-server container speaks SSE at qa-guardian-mcp:3002
        # with /sse (event stream) and /message (client→server posts).
        #
        # We expose it at /mcp-server/* so the path split is explicit:
        #   /mcp/message        → backend adapter  (internal UI)
        #   /mcp-server/sse     → dedicated server (external clients)
        #   /mcp-server/message → dedicated server (external clients)
        #
        # Step back from fancy $variable + regex-capture gymnastics. Two
        # earlier attempts failed because of the interaction between
        # variable-based proxy_pass and prefix stripping. Go simple: static
        # proxy_pass with trailing slash auto-strips the prefix. Tradeoff:
        # nginx caches the upstream IP at startup. If the mcp-server container
        # restarts and gets a new IP, the frontend needs to restart too. Fine
        # for now — we can reintroduce resolver-based re-resolution later
        # once the path routing is proven working end-to-end.
        location /mcp-server/ {
            # Diagnostic: if this header appears in the response, nginx has
            # reloaded with my updated config. If it's absent, the image
            # didn't rebuild and we're looking at stale config. Remove once
            # routing is proven working.
            add_header X-Nginx-Route "mcp-server-proxy-v4" always;
            proxy_pass http://qa-guardian-mcp:3002/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE requires buffering off so events stream in real time.
            proxy_buffering off;
            proxy_cache off;

            # Long-lived SSE connections — keep alive indefinitely.
            proxy_connect_timeout 10s;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # T2.1: MCP JSON-RPC adapter lives on the backend at /mcp/message.
        # We proxy the whole /mcp prefix so future sub-paths also flow through
        # without edits here. This rule must come AFTER /mcp-server/ because
        # nginx matches longest-prefix first.
        location /mcp {
            set $backend_mcp http://backend:3001;
            proxy_pass $backend_mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # MCP tool calls can be slow (AI-powered), match /api timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # WebSocket support for Socket.IO
        location /socket.io {
            set $backend_ws http://backend:3001;
            proxy_pass $backend_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for real-time transport
            proxy_buffering off;

            # Connect should be fast; read/send are long for persistent connections
            proxy_connect_timeout 10s;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # Static assets with long cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # SPA fallback - serve index.html for all other routes
        location / {
            try_files $uri $uri/ /index.html;

            # Cache HTML files for short time
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}

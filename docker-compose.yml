# =============================================================================
# QA Guardian - Development Docker Compose
# =============================================================================
# SECURITY NOTICE: Default passwords in this file are for LOCAL DEVELOPMENT ONLY.
# For production deployments, use docker/docker-compose.prod.yml with proper
# environment variables set (no defaults). Never use these defaults in production!
# =============================================================================
# Feature #361: Removed deprecated "version" key (obsolete since Docker Compose v2)

services:
  postgres:
    image: postgres:15-alpine
    container_name: qa-guardian-postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qa_guardian}
      # DEV ONLY: Default password for local development. Override in production!
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-QaGuardian2024Secure}
      POSTGRES_DB: ${POSTGRES_DB:-qa_guardian}
    # Feature #165: Slow query logging (queries > 1 second)
    command: postgres -c log_min_duration_statement=1000 -c log_statement=none
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_guardian"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qa-network
    # Feature #156: Resource constraints to prevent OOM
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: qa-guardian-redis
    restart: unless-stopped
    # Feature #148: Add password authentication for Redis
    # Feature #156: Add maxmemory policy to prevent OOM
    # DEV ONLY: Default password for local development. Override in production!
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-QaGuardianRedis2024} --maxmemory 400mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      # Feature #361: Use REDISCLI_AUTH env var instead of -a flag to avoid password exposure in docker inspect
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD:-QaGuardianRedis2024} redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qa-network
    # Feature #156: Resource constraints to prevent OOM
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qa-guardian-backend
    restart: unless-stopped
    ports:
      - "3006:3001"
    # Feature #169: Safety net for any residual Chromium usage
    shm_size: '2gb'
    env_file:
      - .env
    environment:
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      # Feature #156: Limit Node.js heap to 1.5GB to leave room for other processes
      - NODE_OPTIONS=--max-old-space-size=1536
      # Feature #209: ZAP API key for DAST scanning
      - ZAP_API_KEY=${ZAP_API_KEY:-dev-zap-key-change-in-prod}
      # Feature #169: Backend runs local worker (explicit override of .env)
      - EXECUTION_MAX_CONCURRENCY=2
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # ZAP is optional - don't block backend startup on ZAP health
      # zap:
      #   condition: service_healthy
    networks:
      - qa-network
    # Feature #156: Resource constraints to prevent OOM
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ===========================================================================
  # Test Execution Worker (Feature #169)
  # ===========================================================================
  # Separate worker for test execution to prevent Chromium OOM from killing API.
  # Uses the same image as backend but runs the BullMQ worker entry point.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qa-guardian-worker
    restart: unless-stopped
    # Feature #169: Chromium needs larger /dev/shm for rendering
    shm_size: '2gb'
    command: ["node", "dist/worker.js"]
    env_file:
      - .env
    environment:
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      # Feature #156: Limit Node.js heap to leave room for Chromium
      - NODE_OPTIONS=--max-old-space-size=1536
      # Feature #169: Worker processes up to 2 test executions concurrently
      - EXECUTION_MAX_CONCURRENCY=2
      - EXECUTION_JOB_TIMEOUT=600000
      - WORKER_HEALTH_PORT=3002
      # Feature #209: ZAP API key for DAST scanning
      - ZAP_API_KEY=${ZAP_API_KEY:-dev-zap-key-change-in-prod}
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - qa-network
    # Feature #169: Extra memory headroom for Chromium browser instances
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 1G

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: qa-guardian-zap
    # Feature #209: Secure ZAP API with key and restrict access to backend only
    # - api.key requires all API requests to include the ZAP_API_KEY
    # - api.addrs restricts access to Docker internal network (backend container)
    # - No host port mapping - ZAP only accessible from internal network
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.key=${ZAP_API_KEY:-dev-zap-key-change-in-prod}
      -config api.addrs.addr.name=qa-guardian-backend
      -config api.addrs.addr.regex=false
    environment:
      # DEV ONLY: Default API key for local development. Override in production!
      ZAP_API_KEY: ${ZAP_API_KEY:-dev-zap-key-change-in-prod}
    # No host port mapping - ZAP only needs to be accessible from backend container
    networks:
      - qa-network
    restart: unless-stopped
    healthcheck:
      # Include API key in health check
      test: ["CMD", "curl", "-f", "http://localhost:8080/JSON/core/view/version/?apikey=${ZAP_API_KEY:-dev-zap-key-change-in-prod}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Feature #156: Resource constraints to prevent OOM
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qa-guardian-frontend
    restart: unless-stopped
    ports:
      - "3007:80"
    depends_on:
      - backend
    networks:
      - qa-network
    # Feature #156: Resource constraints to prevent OOM (Nginx is lightweight)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 32M

  mcp-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qa-guardian-mcp
    restart: unless-stopped
    ports:
      - "3008:3002"
    env_file:
      - .env
    environment:
      - MCP_PORT=3002
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - QA_GUARDIAN_API_URL=http://backend:3001
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      # Feature #156: Limit Node.js heap
      - NODE_OPTIONS=--max-old-space-size=768
    command: ["npx", "tsx", "src/mcp/index.ts"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - backend
    networks:
      - qa-network
    # Feature #156: Resource constraints to prevent OOM
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

# Feature #151: Database backup service (runs daily via cron)
  backup:
    image: postgres:15-alpine
    container_name: qa-guardian-backup
    volumes:
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
      - backup_data:/opt/backups
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-qa_guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-QaGuardian2024Secure}
      POSTGRES_DB: ${POSTGRES_DB:-qa_guardian}
      BACKUP_DIR: /opt/backups
      RETENTION_DAYS: "30"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - qa-network
    # Run backup daily at 2 AM, then sleep
    entrypoint: /bin/sh
    command: >
      -c "
        apk add --no-cache bash coreutils &&
        echo 'Running initial backup...' &&
        bash /usr/local/bin/backup-db.sh &&
        echo 'Initial backup complete. Starting cron schedule...' &&
        while true; do
          sleep 86400;
          echo 'Running scheduled backup...' &&
          bash /usr/local/bin/backup-db.sh;
        done
      "
    restart: unless-stopped
    # Feature #156: Resource constraints (backup is lightweight)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  qa-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_data:
  # Feature #151: Database backup volume
  backup_data:

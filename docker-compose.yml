version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: qa-guardian-postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qa_guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-QaGuardian2024Secure}
      POSTGRES_DB: ${POSTGRES_DB:-qa_guardian}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_guardian"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qa-network
    # Feature #156: Resource constraints to prevent OOM
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: qa-guardian-redis
    restart: unless-stopped
    # Feature #148: Add password authentication for Redis
    # Feature #156: Add maxmemory policy to prevent OOM
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-QaGuardianRedis2024} --maxmemory 400mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-QaGuardianRedis2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qa-network
    # Feature #156: Resource constraints to prevent OOM
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qa-guardian-backend
    restart: unless-stopped
    ports:
      - "3006:3001"
    env_file:
      - .env
    environment:
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      # Feature #156: Limit Node.js heap to 1.5GB to leave room for other processes
      - NODE_OPTIONS=--max-old-space-size=1536
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # ZAP is optional - don't block backend startup on ZAP health
      # zap:
      #   condition: service_healthy
    networks:
      - qa-network
    # Feature #156: Resource constraints to prevent OOM
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: qa-guardian-zap
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8090:8080"
    networks:
      - qa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/JSON/core/view/version/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Feature #156: Resource constraints to prevent OOM
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qa-guardian-frontend
    restart: unless-stopped
    ports:
      - "3007:80"
    depends_on:
      - backend
    networks:
      - qa-network
    # Feature #156: Resource constraints to prevent OOM (Nginx is lightweight)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 32M

  mcp-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qa-guardian-mcp
    restart: unless-stopped
    ports:
      - "3008:3002"
    env_file:
      - .env
    environment:
      - MCP_PORT=3002
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - QA_GUARDIAN_API_URL=http://backend:3001
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      # Feature #156: Limit Node.js heap
      - NODE_OPTIONS=--max-old-space-size=768
    command: ["npx", "tsx", "src/mcp/index.ts"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - backend
    networks:
      - qa-network
    # Feature #156: Resource constraints to prevent OOM
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

# Feature #151: Database backup service (runs daily via cron)
  backup:
    image: postgres:15-alpine
    container_name: qa-guardian-backup
    volumes:
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
      - backup_data:/opt/backups
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-qa_guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-QaGuardian2024Secure}
      POSTGRES_DB: ${POSTGRES_DB:-qa_guardian}
      BACKUP_DIR: /opt/backups
      RETENTION_DAYS: "30"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - qa-network
    # Run backup daily at 2 AM, then sleep
    entrypoint: /bin/sh
    command: >
      -c "
        apk add --no-cache bash coreutils &&
        chmod +x /usr/local/bin/backup-db.sh &&
        echo 'Running initial backup...' &&
        /usr/local/bin/backup-db.sh &&
        echo 'Initial backup complete. Starting cron schedule...' &&
        while true; do
          sleep 86400;
          echo 'Running scheduled backup...' &&
          /usr/local/bin/backup-db.sh;
        done
      "
    restart: unless-stopped
    # Feature #156: Resource constraints (backup is lightweight)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  qa-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_data:
  # Feature #151: Database backup volume
  backup_data:
